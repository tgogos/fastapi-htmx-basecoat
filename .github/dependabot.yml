# Scheduled version updates. Security alerts/PRs work without this file;
# this adds weekly bumps for uv, Actions, and Docker base images.
# Review PRs; do not enable automerge. Vendored HTMX/Basecoat stay manual.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
