<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <meta name="description" content="Sign in" />
    <title>Sign in</title>
    <script>
      (() => {
        try {
          let stored = localStorage.getItem("themeMode");
          if (stored !== "dark" && stored !== "light") {
            const legacy = localStorage.getItem("theme");
            if (legacy === "dark" || legacy === "light") {
              stored = legacy;
              localStorage.setItem("themeMode", legacy);
            }
          }
          if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {}
      })();
    </script>
    <link rel="stylesheet" href="/static/vendor/basecoat/basecoat.min.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <main class="center-screen">
      <form class="card auth-card" action="/auth/login" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <header>
          <h2>Log in</h2>
          <p>Use the demo user from <code>DEMO_USERNAME</code> / <code>DEMO_PASSWORD</code> (default <code>admin</code> / <code>admin123</code>).</p>
        </header>
        <section class="stack">
          {% if error %}
          <div class="alert" role="alert">
            <section>{{ error }}</section>
          </div>
          {% endif %}
          <div class="field">
            <label for="signin-username">Username</label>
            <input class="input" type="text" id="signin-username" name="username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="signin-password">Password</label>
            <input class="input" type="password" id="signin-password" name="password" autocomplete="current-password" required />
          </div>
          <button class="btn btn-block" type="submit">Log in</button>
        </section>
      </form>
    </main>
  </body>
</html>
