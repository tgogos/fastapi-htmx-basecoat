<button
  class="btn theme-switch"
  type="button"
  data-variant="ghost"
  data-size="icon"
  aria-label="Toggle dark mode"
  data-tooltip="Toggle dark mode"
  data-side="bottom"
  onclick="window.basecoat.theme.toggle()"
>
  <span class="when-dark">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg>
  </span>
  <span class="when-light">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></svg>
  </span>
</button>
{% if user %}
<div class="dropdown-menu account-menu" id="account-menu">
  <button type="button" class="avatar" id="account-menu-trigger" aria-haspopup="menu" aria-controls="account-menu-menu" aria-expanded="false" aria-label="{{ user.username }}">
    <span>{{ user.username[:2]|upper }}</span>
  </button>
  <div id="account-menu-popover" data-popover aria-hidden="true" data-side="{{ account_menu_side|default('bottom') }}" data-align="{{ account_menu_align|default('end') }}">
    <div role="menu" id="account-menu-menu" aria-labelledby="account-menu-trigger">
      <div role="heading" id="account-menu-label">{{ user.username }}</div>
      <a role="menuitem" href="/ui/settings">Settings</a>
      <hr role="separator" />
      <form action="/auth/logout" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" role="menuitem">Sign out</button>
      </form>
    </div>
  </div>
</div>
{% else %}
<a class="btn" href="/auth/login">Log in</a>
{% endif %}
