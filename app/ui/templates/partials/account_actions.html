<div class="dropdown-menu color-menu" id="color-menu">
  <button
    type="button"
    class="btn color-switch"
    data-variant="ghost"
    data-size="icon"
    id="color-menu-trigger"
    aria-haspopup="menu"
    aria-controls="color-menu-menu"
    aria-expanded="false"
    aria-label="Color theme"
    data-tooltip="Color theme"
    data-side="{{ tooltip_side|default('bottom') }}"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" /><circle cx="13.5" cy="6.5" r=".5" fill="currentColor" /><circle cx="17.5" cy="10.5" r=".5" fill="currentColor" /><circle cx="6.5" cy="12.5" r=".5" fill="currentColor" /><circle cx="8.5" cy="7.5" r=".5" fill="currentColor" /></svg>
  </button>
  <div id="color-menu-popover" data-popover aria-hidden="true" data-side="{{ account_menu_side|default('bottom') }}" data-align="{{ account_menu_align|default('end') }}">
    <div role="menu" id="color-menu-menu" aria-labelledby="color-menu-trigger">
      <button type="button" role="menuitemradio" data-color-value="default" aria-checked="true">
        <span class="color-swatch" data-swatch="default"></span>
        Default
        <svg data-indicator xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" role="menuitemradio" data-color-value="blue" aria-checked="false">
        <span class="color-swatch" data-swatch="blue"></span>
        Blue
        <svg data-indicator xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" role="menuitemradio" data-color-value="teal" aria-checked="false">
        <span class="color-swatch" data-swatch="teal"></span>
        Teal
        <svg data-indicator xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
      <button type="button" role="menuitemradio" data-color-value="grey" aria-checked="false">
        <span class="color-swatch" data-swatch="grey"></span>
        Grey
        <svg data-indicator xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
      </button>
    </div>
  </div>
</div>
<button
  class="btn theme-switch"
  type="button"
  data-variant="ghost"
  data-size="icon"
  aria-label="Toggle dark mode"
  data-tooltip="Toggle dark mode"
  data-side="{{ tooltip_side|default('bottom') }}"
  onclick="window.basecoat.theme.toggle()"
>
  <span class="when-dark">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg>
  </span>
  <span class="when-light">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" /></svg>
  </span>
</button>
{% if user %}
<div class="dropdown-menu account-menu" id="account-menu">
  {% set account_label = user.display_name or user.username %}
  <button type="button" class="avatar" id="account-menu-trigger" aria-haspopup="menu" aria-controls="account-menu-menu" aria-expanded="false" aria-label="{{ account_label }}">
    <span>{{ account_label[:2]|upper }}</span>
  </button>
  <div id="account-menu-popover" data-popover aria-hidden="true" data-side="{{ account_menu_side|default('bottom') }}" data-align="{{ account_menu_align|default('end') }}">
    <div role="menu" id="account-menu-menu" aria-labelledby="account-menu-trigger">
      <div role="heading" id="account-menu-label">{{ account_label }}</div>
      {% if user.display_name %}
      <p class="muted">{{ user.username }}</p>
      {% endif %}
      <a role="menuitem" href="/ui/settings">Settings</a>
      <hr role="separator" />
      <form action="/auth/logout" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" role="menuitem">Sign out</button>
      </form>
    </div>
  </div>
</div>
{% else %}
<a class="btn" href="/auth/login">Log in</a>
{% endif %}
