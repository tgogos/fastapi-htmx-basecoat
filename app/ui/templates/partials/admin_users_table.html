{% if form_error %}
<div class="alert" role="alert">
  <section>{{ form_error }}</section>
  <footer>
    <button type="button" class="btn flash-dismiss" data-size="xs" data-variant="outline">Dismiss</button>
  </footer>
</div>
{% endif %}
{% if form_ok %}
<div class="alert" role="status">
  <section>{{ form_ok }}</section>
  <footer>
    <button type="button" class="btn flash-dismiss" data-size="xs" data-variant="outline">Dismiss</button>
  </footer>
</div>
{% endif %}

<div class="table-container">
  <table class="table">
    <thead>
      <tr>
        <th scope="col">Username</th>
        <th scope="col">Role</th>
        <th scope="col">Change role</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.username }}{% if u.id == user.id %} <small class="muted">(you)</small>{% endif %}</td>
        <td><code>{{ u.role }}</code></td>
        <td>
          <form
            class="inline-form"
            hx-post="/ui/admin/users/{{ u.id }}/role"
            hx-target="#admin-users-panel"
            hx-swap="innerHTML"
          >
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label class="visually-hidden" for="role-{{ u.id }}">Role for {{ u.username }}</label>
            <select id="role-{{ u.id }}" name="role">
              {% for r in roles %}
              <option value="{{ r }}" {% if r == u.role %}selected{% endif %}>{{ r }}</option>
              {% endfor %}
            </select>
            <button type="submit" class="btn" data-size="sm" data-variant="outline">Save</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
