{% if form_error %}
<div class="alert" role="alert">
  <section>{{ form_error }}</section>
</div>
{% endif %}
<form method="post" action="{{ form_action }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <div class="form-grid">
    <div class="field">
      <label for="page-title">Title</label>
      <input class="input" id="page-title" type="text" name="title" value="{{ values.title }}" required maxlength="200">
    </div>
    <div class="field">
      <label for="page-author">Author</label>
      <input class="input" id="page-author" type="text" name="author" value="{{ values.author }}" required maxlength="200">
    </div>
    <div class="field">
      <label for="page-category">Category</label>
      <select id="page-category" name="category">
        {% for value, label in categories %}
        <option value="{{ value }}" {% if values.category == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="page-year">Year</label>
      <input class="input" id="page-year" type="number" name="year" value="{{ values.year }}" min="0" max="9999">
    </div>
    <div class="field">
      <label for="page-pages">Pages</label>
      <input class="input" id="page-pages" type="number" name="page_count" value="{{ values.page_count }}" min="1" max="100000">
    </div>
    <div class="field">
      <label for="page-isbn">ISBN</label>
      <input class="input" id="page-isbn" type="text" name="isbn" value="{{ values.isbn }}" maxlength="32">
    </div>
    <div class="field span-2">
      <label for="page-notes">Notes</label>
      <input class="input" id="page-notes" type="text" name="notes" value="{{ values.notes }}" maxlength="2000">
    </div>
    <div class="field span-2">
      <label>
        <input class="input" type="checkbox" id="page-available" name="available" value="1" {% if values.available %}checked{% endif %}>
        Available
      </label>
    </div>
    <div class="span-2 form-actions">
      <a class="btn" data-variant="outline" href="{{ cancel_href }}">Cancel</a>
      <button class="btn" type="submit">{{ submit_label }}</button>
    </div>
  </div>
</form>
