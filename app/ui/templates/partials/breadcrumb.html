{% macro crumbs(items) -%}
<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol>
    {%- for item in items %}
    {%- if not loop.first %}
    <li aria-hidden="true">
      <svg data-rtl-flip xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </li>
    {%- endif %}
    <li>
      {%- if item.href and not loop.last %}
      <a href="{{ item.href }}">{{ item.label }}</a>
      {%- else %}
      <span aria-current="page">{{ item.label }}</span>
      {%- endif %}
    </li>
    {%- endfor %}
  </ol>
</nav>
{%- endmacro %}
