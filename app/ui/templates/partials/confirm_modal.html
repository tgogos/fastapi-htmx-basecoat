<div class="modal fade" id="confirm-dialog" tabindex="-1" aria-labelledby="confirm-dialog-title" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="confirm-dialog-title">Confirm</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" data-confirm-cancel aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p id="confirm-dialog-message" class="mb-0">Are you sure?</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-confirm-cancel>Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-dialog-ok" data-confirm-ok>Delete</button>
          </div>
        </div>
      </div>
    </div>
    <div id="toast-region" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-relevant="additions"></div>
    {% if toast %}
    <div id="pending-toast" hidden data-message="{{ toast.message }}" data-level="{{ toast.level }}"></div>
    {% endif %}
