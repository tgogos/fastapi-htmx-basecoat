<dialog
      id="confirm-dialog"
      class="dialog"
      aria-labelledby="confirm-dialog-title"
      onclick="if (event.target === this) this.close()"
    >
      <div>
        <header>
          <h2 id="confirm-dialog-title">Confirm</h2>
        </header>
        <section>
          <p id="confirm-dialog-message"></p>
        </section>
        <footer>
          <button type="button" class="btn" data-variant="outline" data-confirm-cancel>Cancel</button>
          <button type="button" class="btn" data-variant="destructive" id="confirm-dialog-ok" data-confirm-ok>Delete</button>
        </footer>
      </div>
    </dialog>
    <div id="toaster" class="toaster"></div>
    {% if toast %}
    <div id="pending-toast" hidden data-message="{{ toast.message }}" data-level="{{ toast.level }}"></div>
    {% endif %}
