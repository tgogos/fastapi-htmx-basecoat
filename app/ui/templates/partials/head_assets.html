<script>
      (() => {
        try {
          let stored = localStorage.getItem("themeMode");
          if (stored !== "dark" && stored !== "light") {
            const legacy = localStorage.getItem("theme");
            if (legacy === "dark" || legacy === "light") {
              stored = legacy;
              localStorage.setItem("themeMode", legacy);
            }
          }
          if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.classList.add("dark");
          }
          const color = localStorage.getItem("colorTheme");
          if (color === "blue" || color === "teal" || color === "grey") {
            document.documentElement.setAttribute("data-color", color);
          }
        } catch (_) {}
      })();
    </script>
    <link rel="stylesheet" href="/static/vendor/basecoat/basecoat.min.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    {% for href in extra_css or [] %}
    <link rel="stylesheet" href="{{ href }}" />
    {% endfor %}
