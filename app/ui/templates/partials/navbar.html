<header class="shell-header">
      <button
        class="btn"
        type="button"
        data-variant="ghost"
        aria-controls="sidebar"
        aria-label="Toggle navigation"
        onclick="document.getElementById('sidebar').toggle()"
      >
        Menu
      </button>
      <a href="/ui/dashboard">Admin</a>
      <div class="shell-header-end">
        <button class="btn" type="button" data-variant="outline" id="theme-toggle">Theme</button>
        {% if user %}
        <span>{{ user.username }}</span>
        <form action="/auth/logout" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="btn" type="submit" data-variant="ghost">Sign out</button>
        </form>
        {% else %}
        <a class="btn" href="/auth/login">Log in</a>
        {% endif %}
      </div>
    </header>
