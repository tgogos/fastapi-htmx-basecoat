{% macro new_password_fields(id_prefix, password_label, hint) %}
<div class="field">
  <label for="{{ id_prefix }}-password">{{ password_label }}</label>
  <input class="input" id="{{ id_prefix }}-password" type="password" name="password" required autocomplete="new-password" minlength="8" data-show-password="{{ id_prefix }}-show-password">
  {% if hint %}
  <p class="muted">{{ hint }}</p>
  {% endif %}
</div>
<div class="field">
  <label for="{{ id_prefix }}-password-confirm">Confirm password</label>
  <input class="input" id="{{ id_prefix }}-password-confirm" type="password" name="password_confirm" required autocomplete="new-password" minlength="8" data-show-password="{{ id_prefix }}-show-password">
</div>
<div class="span-2">
  <label class="show-password">
    <input class="input" type="checkbox" id="{{ id_prefix }}-show-password" data-show-password-toggle>
    Show password
  </label>
</div>
{% endmacro %}
