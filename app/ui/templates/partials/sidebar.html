<aside id="sidebar" class="sidebar" data-side="left">
  <nav aria-label="Primary">
    <header>
      <a href="/ui/dashboard">Admin</a>
    </header>
    <section>
      <div role="group" aria-label="App">
        <h3>App</h3>
        <ul>
          <li>
            <a href="/ui/dashboard" {% if active == 'dashboard' %}aria-current="page"{% endif %}><span>Dashboard</span></a>
          </li>
          <li>
            <a href="/ui/books" {% if active == 'books' %}aria-current="page"{% endif %}><span>Books</span></a>
          </li>
          <li>
            <a href="/ui/books/search" {% if active == 'books-search' %}aria-current="page"{% endif %}><span>Search books</span></a>
          </li>
          {% if is_admin %}
          <li>
            <a href="/ui/admin/users" {% if active == 'staff' %}aria-current="page"{% endif %}><span>Staff</span></a>
          </li>
          {% endif %}
        </ul>
      </div>
      <div role="group" aria-label="Samples">
        <h3>Samples</h3>
        <ul>
          <li>
            <a href="/ui/users" {% if active == 'users' %}aria-current="page"{% endif %}><span>Users</span></a>
          </li>
          <li>
            <a href="/ui/forms" {% if active == 'forms' %}aria-current="page"{% endif %}><span>Forms</span></a>
          </li>
          <li>
            <a href="/ui/tables" {% if active == 'tables' %}aria-current="page"{% endif %}><span>Tables</span></a>
          </li>
          <li>
            <a href="/ui/components" {% if active == 'components' %}aria-current="page"{% endif %}><span>Components</span></a>
          </li>
          <li>
            <a href="/ui/settings" {% if active == 'settings' %}aria-current="page"{% endif %}><span>Settings</span></a>
          </li>
          <li>
            <a href="/ui/blank" {% if active == 'blank' %}aria-current="page"{% endif %}><span>Blank</span></a>
          </li>
          <li>
            <a href="/ui/settings#help"><span>Help</span></a>
          </li>
        </ul>
      </div>
    </section>
    <footer>
      {% if user %}
      <p>{{ user.username }}</p>
      <button class="btn" type="button" data-variant="ghost" id="theme-toggle">Theme</button>
      <form action="/auth/logout" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="btn" type="submit" data-variant="ghost">Sign out</button>
      </form>
      {% else %}
      <button class="btn" type="button" data-variant="ghost" id="theme-toggle">Theme</button>
      <a class="btn" href="/auth/login">Log in</a>
      {% endif %}
    </footer>
  </nav>
</aside>
